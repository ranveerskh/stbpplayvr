name: Publish signed STB PLAY Android release

on:
  push:
    tags: ['v*']
    branches: ['release/*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        run: echo "RELEASE_TAG=v${GITHUB_REF#refs/heads/release/}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore private signing key
        env:
          STB_SIGNING_KEYSTORE_B64: ${{ secrets.STB_SIGNING_KEYSTORE_B64 }}
          STB_RELEASE_STORE_PASSWORD: ${{ secrets.STB_RELEASE_STORE_PASSWORD }}
          STB_RELEASE_KEY_ALIAS: ${{ secrets.STB_RELEASE_KEY_ALIAS }}
          STB_RELEASE_KEY_PASSWORD: ${{ secrets.STB_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$STB_SIGNING_KEYSTORE_B64" && test -n "$STB_RELEASE_STORE_PASSWORD" && test -n "$STB_RELEASE_KEY_ALIAS" && test -n "$STB_RELEASE_KEY_PASSWORD" || { echo 'Configure all four Android signing secrets before publishing.'; exit 1; }
          printf '%s' "$STB_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/stb-release.jks"
          chmod 600 "$RUNNER_TEMP/stb-release.jks"
      - name: Build signed release APK
        env:
          STB_RELEASE_KEYSTORE: ${{ runner.temp }}/stb-release.jks
          STB_RELEASE_STORE_PASSWORD: ${{ secrets.STB_RELEASE_STORE_PASSWORD }}
          STB_RELEASE_KEY_ALIAS: ${{ secrets.STB_RELEASE_KEY_ALIAS }}
          STB_RELEASE_KEY_PASSWORD: ${{ secrets.STB_RELEASE_KEY_PASSWORD }}
        run: |
          grep -Fq "versionName = \"${RELEASE_TAG#v}\"" app/build.gradle.kts || { echo 'Release tag must match app versionName.'; exit 1; }
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "STB-PLAY-Android-${RELEASE_TAG}.apk"
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "STB-PLAY-Android-${RELEASE_TAG}.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "STB-PLAY-Android-${RELEASE_TAG}.apk" --target "$GITHUB_SHA" --title "STB Play ${RELEASE_TAG#v}" --notes "Adult mode remains available. Returning users open Home directly while the portal reconnects; portal and playback recovery messages are clearer, and Back navigation is easier to use. Install within 14 days of publication."
          fi
