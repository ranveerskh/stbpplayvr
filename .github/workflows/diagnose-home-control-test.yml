name: Diagnose phone control idle test clock
on:
  push:
    branches: [test/home-control-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
          python3 -m http.server 8765 --bind 127.0.0.1 --directory app/src/androidTest/assets > "$RUNNER_TEMP/playback-fixture-server.log" 2>&1 &
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.stbplay.ui.screens.PlaybackSmokeTest#moviePlaysAndBackCallbackWorksOnTvAndPhone
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-control-idle-diagnostics
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
