name: Verify isolated YouTube portal test
on:
  push:
    branches: [experiment/youtube-portal-2.10.26.5]
permissions:
  contents: read
concurrency:
  group: youtube-portal-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STB_RELEASE_STORE_PASSWORD: ${{ secrets.STB_RELEASE_STORE_PASSWORD }}
      STB_RELEASE_KEY_ALIAS: ${{ secrets.STB_RELEASE_KEY_ALIAS }}
      STB_RELEASE_KEY_PASSWORD: ${{ secrets.STB_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore original signing key
        env:
          STB_SIGNING_KEYSTORE_B64: ${{ secrets.STB_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$STB_SIGNING_KEYSTORE_B64"
          printf '%s' "$STB_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/stb-release.jks"
          chmod 600 "$RUNNER_TEMP/stb-release.jks"
          echo "STB_RELEASE_KEYSTORE=$RUNNER_TEMP/stb-release.jks" >> "$GITHUB_ENV"
      - name: Build signed isolated app and run unit tests
        id: build
        env:
          STB_RELEASE_KEYSTORE: ${{ runner.temp }}/stb-release.jks
          STB_RELEASE_STORE_PASSWORD: ${{ secrets.STB_RELEASE_STORE_PASSWORD }}
          STB_RELEASE_KEY_ALIAS: ${{ secrets.STB_RELEASE_KEY_ALIAS }}
          STB_RELEASE_KEY_PASSWORD: ${{ secrets.STB_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PstbTestBuildType=portalTest testPortalTestUnitTest assemblePortalTest assemblePortalTestAndroidTest
      - name: Verify isolated package and original signing certificate
        run: |
          apk=app/build/outputs/apk/portalTest/app-portalTest.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > signing.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: 91943d0efc4125eb6aeda132ba6b8d79855496e030477c2d5cd00e9bedd4fdb0' signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > package.txt
          grep -F "package: name='com.example.stbplay.portaltest' versionCode='84' versionName='2.10.26.5-portal-test.1'" package.txt
          cp "$apk" STB-PLAY-Portal-Test-1.apk
          sha256sum STB-PLAY-Portal-Test-1.apk > sha256.txt
          git rev-parse HEAD > source-commit.txt
      - name: Compare lint with stable .5
        run: |
          ./gradlew --no-daemon lintPortalTest || true
          git worktree add --detach "$RUNNER_TEMP/stb-lint-baseline" v2.10.26.5
          ./gradlew --no-daemon --project-dir "$RUNNER_TEMP/stb-lint-baseline" lintDebug || true
          python3 ci/verify_lint_regressions.py "$RUNNER_TEMP/stb-lint-baseline/app/build/reports/lint-results-debug.xml" app/build/reports/lint-results-portalTest.xml
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test phone catalogue and portal switching
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon -PstbTestBuildType=portalTest connectedPortalTestAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.stbplay.ui.ExperimentalPortalTest,com.example.stbplay.ui.ViewerStorageTest,com.example.stbplay.data.SeriesHistoryStorageTest
      - name: Preserve phone reports
        if: always()
        run: |
          mkdir -p validation/phone
          cp -R app/build/outputs/androidTest-results validation/phone/ 2>/dev/null || true
      - name: Test TV catalogue and portal switching
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon -PstbTestBuildType=portalTest connectedPortalTestAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.stbplay.ui.ExperimentalPortalTest,com.example.stbplay.ui.TvNavigationFocusTest
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STB-Portal-Test-1-reports
          path: |
            validation/
            app/build/reports/
            app/build/outputs/androidTest-results/
            signing.txt
            package.txt
            sha256.txt
            source-commit.txt
      - name: Upload passed signed test APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: STB-PLAY-Portal-Test-1-signed
          path: STB-PLAY-Portal-Test-1.apk
          if-no-files-found: error
